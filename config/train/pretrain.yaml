# Default pretraining configuration. Mirrors the constants in the original pretrain.py.

batch_size: 8
num_workers: 8
max_epochs: 5
accelerator: gpu
devices: [0, 1, 2, 3, 4, 5, 6, 7]

checkpoint:
  dirpath: ./checkpoints
  every_n_train_steps: 5000

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-3
  projection_weight_decay: 0.1

# Optional training switches (set to true to disable the matching loss term).
no_reconstruction: false
no_contrastive: false
