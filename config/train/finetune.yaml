# Default finetuning / evaluation configuration.

epochs: 3
batch_size: 8
num_workers: 8
seed: 42
train_ratio: 0.8
devices: [0, 1, 2, 3, 4, 5, 6, 7]

# Whether to add the subject-adapter bias path and to load pretrained encoder weights.
use_bias: false
load_weights: true

optimizer:
  classifier_lr: 1.0e-4
  classifier_weight_decay: 0.0
  encoder_lr: 3.0e-5
  encoder_weight_decay: 0.05
  latent_token_lr: 3.0e-4
  latent_token_weight_decay: 0.01
  query_lr: 3.0e-4
  query_weight_decay: 0.01
  projection_lr: 3.0e-4
  projection_weight_decay: 0.001
